name: Touch controls tests

on:
  push:
    branches:
      - integracion-controles-touch-035
      - fix-039-sel-bag-haptics
    paths:
      - "src/OpenGMK/gm8emulator/src/**"
      - "verification/**"
      - ".github/workflows/touch-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-touch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test touch profiles, mappings and geometry
        run: |
          rustc --edition=2021 --test verification/touch_tests.rs -o /tmp/touch-tests
          /tmp/touch-tests --test-threads=1
      - name: Test PC box long-press, drag and cancellation
        run: |
          rustc --edition=2021 --test src/OpenGMK/gm8emulator/src/box_touch.rs -o /tmp/box-touch-tests
          /tmp/box-touch-tests --test-threads=1

  # Build checks run only on this test branch. No APK is uploaded or published.
  android-smoke:
    if: github.ref_name == 'fix-039-sel-bag-haptics'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: fixes-039-rust199-ndk27-${{ hashFiles('src/OpenGMK/Cargo.lock', 'src/OpenGMK/gm8emulator/src/**/*.rs', 'vendor/**/*.rs') }}
      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 aarch64-linux-android
          cargo +1.99.0 install cargo-ndk --version 3.5.4 --locked
      - name: Verify ARM64 native emulator
        working-directory: src/OpenGMK
        run: cargo +1.99.0 ndk -t arm64-v8a --platform 29 build -p gm8emulator --lib --release --locked
      - name: Verify Android and haptics integration
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false -PcontrolsBuild=true -PtargetAbi=arm64-v8a
      # Intentionally no actions/upload-artifact: compiled APK remains on disposable runner.
