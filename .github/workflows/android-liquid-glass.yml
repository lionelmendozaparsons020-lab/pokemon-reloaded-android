name: Android Liquid Glass

on:
  push:
    branches: [android/liquid-glass-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: mods-039-rust199-ndk27-16k-${{ hashFiles('src/OpenGMK/Cargo.lock', 'src/OpenGMK/gm8emulator/src/**/*.rs', 'vendor/**/*.rs') }}
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 aarch64-linux-android
          cargo +1.99.0 install cargo-ndk --version 3.5.4 --locked
      - name: Test joystick and PC gestures
        run: |
          rustc +1.99.0 --edition=2021 --test verification/touch_tests.rs -o /tmp/touch-tests
          /tmp/touch-tests --test-threads=1
          rustc +1.99.0 --edition=2021 --test src/OpenGMK/gm8emulator/src/box_touch.rs -o /tmp/box-touch-tests
          /tmp/box-touch-tests --test-threads=1
      - name: Test GML cheat patch applicability
        run: rustc +1.99.0 --edition=2021 --test src/OpenGMK/gm8emulator/src/patches.rs -o /tmp/mods-patch-tests && /tmp/mods-patch-tests
      - name: Compile ARM64 engine
        working-directory: src/OpenGMK
        run: cargo +1.99.0 ndk -t arm64-v8a --platform 29 build -p gm8emulator --lib --release --locked
      - name: Compile Android and unit tests
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false -PcontrolsBuild=true -PtargetAbi=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-arm64-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Sign with original keystore, only if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASS:-}" ]; then
            echo "Keystore original not configured; will not ship an incompatible signature."
            echo "SIGNED_APK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/reloaded-release.jks"
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          mkdir -p signed-apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/reloaded-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out signed-apk/Reloaded-Android-Liquid-Glass-v24.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs signed-apk/Reloaded-Android-Liquid-Glass-v24.apk
          CERT=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs signed-apk/Reloaded-Android-Liquid-Glass-v24.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$CERT" = "1ed0f054e3f094cf13819312cbcd7688bf940b6aa1a1eaa10f2fccdc32c04260"
          echo "SIGNED_APK=true" >> "$GITHUB_ENV"
      - name: Upload signed APK (when available)
        if: env.SIGNED_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-liquid-glass-firmado
          path: signed-apk/Reloaded-Android-Liquid-Glass-v24.apk
          retention-days: 30

  ui:
    name: Native UI verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: SDK and NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: glass-ui-x86-rust199-${{ hashFiles('src/OpenGMK/Cargo.lock', 'src/OpenGMK/gm8emulator/src/**/*.rs', 'vendor/**/*.rs') }}
      - name: Compile emulator engine
        working-directory: src/OpenGMK
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 x86_64-linux-android
          cargo +1.99.0 install cargo-ndk --version 3.5.4 --locked
          cargo +1.99.0 ndk -t x86_64 --platform 29 build -p gm8emulator --lib --release --locked
      - name: Preserve compiled UI engine
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: glass-ui-x86-rust199-${{ hashFiles('src/OpenGMK/Cargo.lock', 'src/OpenGMK/gm8emulator/src/**/*.rs', 'vendor/**/*.rs') }}
      - name: Compile instrumentation tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PcontrolsBuild=true -PtargetAbi=x86_64
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run native UI tests and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash verification/run-glass-ui-tests.sh
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-ui-verification
          if-no-files-found: warn
          path: |
            verification-output/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
