name: Verify Controles 0.3.9 fixes
on:
  push:
    branches: [fix-sel-mochila-vibracion-039]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-touch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check SEL geometry, menu profile, joystick and PC gestures
        run: |
          rustc --edition=2021 --test verification/touch_tests.rs -o /tmp/controles-tests
          /tmp/controles-tests --test-threads=1
          rustc --edition=2021 --test src/OpenGMK/gm8emulator/src/box_touch.rs -o /tmp/box-tests
          /tmp/box-tests --test-threads=1
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile Android and run touch unit tests
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false -PcontrolsBuild=true -PtargetAbi=arm64-v8a
  native-android-arm64-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: controles-arm64-rust199-ndk27-16k-${{ hashFiles('src/OpenGMK/Cargo.lock', 'src/OpenGMK/gm8emulator/src/**/*.rs', 'vendor/**/*.rs') }}
      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 aarch64-linux-android
          cargo +1.99.0 install cargo-ndk --version 3.5.4 --locked
      - name: Check ARM64 native engine without publishing APK
        working-directory: src/OpenGMK
        run: cargo +1.99.0 ndk -t arm64-v8a --platform 29 build -p gm8emulator --lib --release --locked
