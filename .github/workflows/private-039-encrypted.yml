name: Build private encrypted APK 0.3.9 fixes
on:
  push:
    branches: [fix-039-sel-mochila-vibracion]
    paths:
      - '.github/workflows/private-039-encrypted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: false
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: controles-arm64-rust199-ndk27-16k-${{ hashFiles('src/OpenGMK/Cargo.lock', 'src/OpenGMK/gm8emulator/src/**/*.rs', 'vendor/**/*.rs') }}
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 aarch64-linux-android
          cargo +1.99.0 install cargo-ndk --version 3.5.4 --locked
      - name: Test touch input and PC gestures
        run: |
          rustc +1.99.0 --edition=2021 --test verification/touch_tests.rs -o /tmp/touch-tests
          /tmp/touch-tests --test-threads=1
      - name: Compile ARM64 engine
        working-directory: src/OpenGMK
        run: cargo +1.99.0 ndk -t arm64-v8a --platform 29 build -p gm8emulator --lib --release --locked
      - name: Test Android and build unsigned Controles APK
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false -PcontrolsBuild=true -PtargetAbi=arm64-v8a
      - name: Sign APK with original key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/controles-release.jks"
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p signed-apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/controles-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out signed-apk/pokemon-reloaded-controles-039-signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs \
            signed-apk/pokemon-reloaded-controles-039-signed.apk

      - name: Encrypt private APK before artifact upload
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/crypto-venv"
          "$RUNNER_TEMP/crypto-venv/bin/pip" -q install 'cryptography>=44,<47'
          mkdir -p encrypted
          "$RUNNER_TEMP/crypto-venv/bin/python" - <<'PY'
          import os, base64, hashlib, pathlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          source = pathlib.Path("signed-apk/pokemon-reloaded-controles-039-signed.apk")
          target = pathlib.Path("encrypted/private-039-fixes.apk.aes")
          secret = base64.b64decode(os.environ["KEYSTORE_B64"].strip())
          assert len(secret)>1000, "Missing original signing key"
          key = hashlib.sha256(b"pkr-apk-encryption-v1" + secret).digest()
          nonce = os.urandom(12)
          ciphertext = AESGCM(key).encrypt(nonce, source.read_bytes(), None)
          target.write_bytes(b"PKR039ENC1" + nonce + ciphertext)
          assert len(ciphertext)>1000000
          print("Private APK encrypted; no plaintext APK uploaded.")
          PY
          rm -f signed-apk/*.apk "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP/controles-release.jks"

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: private-encrypted-039-fixes
          path: encrypted/private-039-fixes.apk.aes
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
